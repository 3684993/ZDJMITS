name: V3.9.x Verify

on:
  push:
    branches:
      - main
      - 'online/v397-*'
      - fix/v392-astra-final-fixes
      - gpt56-closeout-20260912
      - gpt56-optimize-v392-20260912
      - trading-quality-stage1-3-20260914
      - v393-offline-implementation-20260914
      - codex/v393-final-audit-20260915
      - v393-p0-runtime-recovery-20260915
      - v393-p0-tp-risk-recovery-20260915
      - v393-private-truth-tp-canary-20260916
      - v394-binance-governance-settings-20260918
      - v395-*
  workflow_dispatch:

concurrency:
  group: v39x-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Apply V3.9.3 autonomous Entry migration
        if: github.ref_name != 'main' && !startsWith(github.ref_name, 'online/v397-') && github.ref_name != 'v394-binance-governance-settings-20260918' && !startsWith(github.ref_name, 'v395-')
        shell: pwsh
        run: |
          node scripts/v393-apply-autonomous-entry-patch.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/v393-fix-entry-wiring.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/v393-contract-cleanup.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Persist migration patch
        if: github.ref_name != 'main' && !startsWith(github.ref_name, 'online/v397-') && github.ref_name != 'v394-binance-governance-settings-20260918' && !startsWith(github.ref_name, 'v395-')
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/engine/src/services/entryCoordinator.ts apps/engine/src/services/preAiExecutionEnvelope.ts apps/engine/src/services/aiFabric.ts packages/core/src/compactEntry.ts packages/contracts/src/ai.ts
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "fix(v393): complete autonomous Entry execution wiring"
            git push origin HEAD:${{ github.ref_name }}
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Diff check for current change set
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -eq "main") {
            $base = "${{ github.event.before }}"
          } else {
            $base = (git merge-base origin/main HEAD)
          }
          if (-not $base -or $base -match '^0+$') { $base = "HEAD^" }
          Write-Host "git diff --check $base..HEAD"
          git diff --check "$base..HEAD"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build workspace type prerequisites
        shell: pwsh
        run: |
          npm run build --workspace @zdj/contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --workspace @zdj/core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify scripts
        run: npm run verify:scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        shell: pwsh
        run: |
          npm run test --workspace @zdj/contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test --workspace @zdj/core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test --workspace @zdj/dashboard
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ci --workspace @zdj/engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
