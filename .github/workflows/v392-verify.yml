name: V3.9.x Verify

on:
  push:
    branches:
      - fix/v392-astra-final-fixes
      - gpt56-closeout-20260912
      - gpt56-optimize-v392-20260912
      - trading-quality-stage1-3-20260914
      - v393-offline-implementation-20260914
      - codex/v393-final-audit-20260915
      - v393-p0-runtime-recovery-20260915
      - v393-p0-tp-risk-recovery-20260915
      - v393-private-truth-tp-canary-20260916
      - v394-binance-governance-settings-20260918
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Apply V3.9.3 autonomous Entry migration
        shell: pwsh
        run: |
          node scripts/v393-apply-autonomous-entry-patch.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/v393-fix-entry-wiring.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/v393-contract-cleanup.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Persist migration patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/engine/src/services/entryCoordinator.ts apps/engine/src/services/preAiExecutionEnvelope.ts apps/engine/src/services/aiFabric.ts packages/core/src/compactEntry.ts packages/contracts/src/ai.ts
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "fix(v393): complete autonomous Entry execution wiring"
            git push origin HEAD:${{ github.ref_name }}
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build workspace type prerequisites
        shell: pwsh
        run: |
          npm run build --workspace @zdj/contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --workspace @zdj/core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify
        run: npm run verify
