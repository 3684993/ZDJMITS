name: V3.9.8 Read-only Verify

on:
  push:
    branches: ['codex/v398-*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: v398-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Diff check
        shell: pwsh
        run: |
          $base = git merge-base origin/main HEAD
          git diff --check "$base..HEAD"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install locked dependencies
        run: npm ci
      - name: Full offline verification
        # Identical gates and all workspace tests; use the existing bounded
        # four-shard Engine CI runner to avoid worker RPC starvation on Windows.
        run: npm run verify:ci
